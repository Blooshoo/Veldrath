name: Veldrath Web CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, Test, and E2E
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/veldrath
      BETTER_AUTH_SECRET: test-better-auth-secret-change-me-0123456789abcdef
      ORIGIN: http://localhost:4173
      JWT_KEY: test-jwt-signing-key-change-me-0123456789abcdef
      JWT_ISSUER: Veldrath.Server
      JWT_AUDIENCE: Veldrath.Client
      CI: 'true'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veldrath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veldrath"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare auth schema
        run: |
          node --input-type=module -e "
            import postgres from 'postgres';
            const sql = postgres(process.env.DATABASE_URL);
            await sql\`CREATE SCHEMA IF NOT EXISTS auth\`;
            await sql\`ALTER DATABASE veldrath SET search_path TO auth, public\`;
            await sql.end();
          "

      - name: Generate and apply migrations
        run: |
          npm run db:generate
          npm run db:migrate

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test shared
        run: npm run test --workspace shared

      - name: Test client unit
        run: npm run test:unit --workspace client -- --run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test client e2e
        working-directory: client
        run: npx playwright test --reporter=github,html

      - name: Upload client build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/build
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          if-no-files-found: ignore
          retention-days: 14
