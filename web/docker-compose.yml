# docker-compose.yml — local SvelteKit + auth database.
#
# The root repository docker-compose.yml remains the authoritative stack for
# Postgres, Veldrath.Server, and the desktop tooling. This file is a
# self-contained web-only stack for developing the SvelteKit frontend.
#
# No Caddy: adapter-node listens directly on the container port, and the hosting
# platform proxy handles TLS in production.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veldrath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veldrath_dev}
      POSTGRES_DB: ${POSTGRES_DB:-veldrath}
    volumes:
      - veldrath_web_pgdata:/var/lib/postgresql/data
      - ./shared/db/init-auth-schema.sql:/docker-entrypoint-initdb.d/01-auth-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-veldrath} -d ${POSTGRES_DB:-veldrath}']
      interval: 5s
      timeout: 5s
      retries: 10

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ORIGIN: ${ORIGIN:-http://localhost:8080}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-better-auth-secret-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgres://veldrath_auth:veldrath_auth_dev@postgres:5432/veldrath}
      JWT_KEY: ${JWT_KEY:-dev-secret-key-change-in-production-must-be-32-chars}
      JWT_ISSUER: ${JWT_ISSUER:-Veldrath.Server}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-Veldrath.Client}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:9000}
      PUBLIC_HUB_URL: ${PUBLIC_HUB_URL:-http://localhost:9000/hubs/game}
    ports:
      - '${CLIENT_PORT:-8080}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(() => process.exit(0)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  veldrath_web_pgdata:
