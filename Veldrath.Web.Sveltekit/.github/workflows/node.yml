name: Node CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/yourproject
      BETTER_AUTH_SECRET: test-better-auth-secret-change-me-0123456789abcdef
      ORIGIN: http://localhost:4173
      WS_AUTH_SECRET: test-ws-auth-secret-change-me-0123456789abcdef
      WS_URL: ws://localhost:3000
      CI: "true"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yourproject
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yourproject"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗂️ Prepare results dir
        run: mkdir -p ci-results

      # ---- Gates (continue-on-error so every result is collected for the summary) ----

      - name: 🏗️ Build
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee ci-results/build.log

      - name: 🏗️ Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee ci-results/typecheck.log

      - name: 🔎 Lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee ci-results/lint.log

      - name: 🗄️ Apply database migrations
        id: migrate
        continue-on-error: true
        run: npm run db:migrate 2>&1 | tee ci-results/migrate.log

      - name: 🧪 Test — shared
        id: test-shared
        continue-on-error: true
        run: npm run test --workspace shared -- --reporter=json --outputFile.json=../ci-results/shared.json

      - name: 🧪 Test — engine
        id: test-engine
        continue-on-error: true
        run: npm run test --workspace engine -- --reporter=json --outputFile.json=../ci-results/engine.json

      - name: 🧪 Test — server
        id: test-server
        continue-on-error: true
        run: npm run test --workspace server -- --reporter=json --outputFile.json=../ci-results/server.json

      - name: 🧪 Test — client (unit)
        id: test-client
        continue-on-error: true
        run: npm run test:unit --workspace client -- --run --reporter=json --outputFile.json=../ci-results/client.json

      - name: 🌐 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 🧪 Test — e2e (Playwright)
        id: test-e2e
        continue-on-error: true
        working-directory: client
        run: npx playwright test --reporter=github,html 2>&1 | tee ../ci-results/e2e.log

      - name: 📊 Coverage (shared/engine/server)
        id: coverage
        continue-on-error: true
        run: npm run coverage 2>&1 | tee ci-results/coverage.log

      # ---- Artifacts (always upload what exists) ----

      - name: 📦 Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            shared/coverage
            engine/coverage
            server/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: 📦 Upload client build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/build
          if-no-files-found: ignore
          retention-days: 14

      - name: 📦 Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: 📦 Upload CI logs + results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: ci-results
          if-no-files-found: ignore
          retention-days: 14

      # ---- Live per-run "CI/CD dashboard" (job step summary) ----
      # `outcome` (not `conclusion`) reflects a step's real result even under
      # continue-on-error; the script fails the job when any gate failed.
      - name: 📊 Summarize results
        if: always()
        run: node scripts/ci-summary.mjs build=${{ steps.build.outcome }} typecheck=${{ steps.typecheck.outcome }} lint=${{ steps.lint.outcome }} migrate=${{ steps.migrate.outcome }} test-shared=${{ steps.test-shared.outcome }} test-engine=${{ steps.test-engine.outcome }} test-server=${{ steps.test-server.outcome }} test-client=${{ steps.test-client.outcome }} test-e2e=${{ steps.test-e2e.outcome }} coverage=${{ steps.coverage.outcome }}
