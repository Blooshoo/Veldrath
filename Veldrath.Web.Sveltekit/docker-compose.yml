# docker-compose.yml — TypeScript npm-workspaces monorepo template
#
# Service graph (dependency order): postgres -> server -> client
#   - postgres: official PostgreSQL 16 (named volume, pg_isready healthcheck)
#   - server:   Colyseus WebSocket server (server/Dockerfile) — ws://:3000
#   - client:   SvelteKit adapter-node app (client/Dockerfile) — http://:3000 -> host
#
# Coolify usage:
#   1. In Coolify, add an application and import this repository as a
#      "Docker Compose" project, pointing at this docker-compose.yml. The build
#      context is the repo root, so the Dockerfiles resolve the npm workspaces.
#   2. Override domains / ports in the Coolify UI (or a .env next to this file):
#      - set ORIGIN to the public https:// URL of the client,
#      - set WS_URL to the public wss:// URL of the server,
#      - set CLIENT_PORT / SERVER_PORT if not using Coolify's proxy.
#   3. Secrets (POSTGRES_PASSWORD, WS_AUTH_SECRET, BETTER_AUTH_SECRET) are
#      injected via compose interpolation — never hardcoded. See
#      docker-compose.env.example for every variable.
#
# Local: cp docker-compose.env.example .env && docker compose up -d --build
#
# All `${VAR:-default}` values can be set via the environment or a `.env` file
# next to this file. Secrets have dev-only placeholder defaults and MUST be
# overridden for any real deployment.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-yourproject}
    volumes:
      - yourproject_pgdata:/var/lib/postgresql/data/18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yourproject}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      # Context stays the repo root so the npm workspaces resolve; the Dockerfile
      # lives in the server workspace (dockerfile path is relative to context).
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # HTTP/WebSocket listen config (internal)
      PORT: "3000"
      HOST: "0.0.0.0"
      # App DB — shared with the client (same database; server owns app tables,
      # client owns auth tables). Host `postgres` = the compose service above.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-yourproject}}
      # WS ticket HMAC secret — MUST match the client's WS_AUTH_SECRET.
      WS_AUTH_SECRET: ${WS_AUTH_SECRET:-dev-ws-auth-secret-change-me}
    ports:
      # Host override: SERVER_PORT (default 3000)
      - "${SERVER_PORT:-3000}:3000"
    healthcheck:
      # Colyseus has no /health endpoint — TCP connect to the WS port.
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('net');const s=net.connect(3000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000).unref()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  client:
    build:
      # Context stays the repo root so the npm workspaces resolve; the Dockerfile
      # lives in the client workspace (dockerfile path is relative to context).
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # adapter-node requires ORIGIN at runtime — override with the public URL.
      ORIGIN: ${ORIGIN:-http://localhost:5173}
      # Better Auth secret (client process owns Better Auth).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-better-auth-secret-change-me}
      # WS ticket HMAC secret — MUST match the server's WS_AUTH_SECRET.
      WS_AUTH_SECRET: ${WS_AUTH_SECRET:-dev-ws-auth-secret-change-me}
      # App DB — same database as the server (auth tables only).
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-yourproject}}
      # WS endpoint the browser client connects to (public, overridable).
      WS_URL: ${WS_URL:-ws://localhost:3000}
    ports:
      # adapter-node listens on 3000 internally; host override CLIENT_PORT (default 5173).
      - "${CLIENT_PORT:-5173}:3000"
    healthcheck:
      # Any HTTP response (200/404/...) means the adapter-node server is up.
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  yourproject_pgdata:
